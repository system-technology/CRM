    source: ADR-0035 §2 y §5; T-343 no lo pudo pintar por falta de endpoint
    created_at: 2026-11-21T23:00:00.000Z
    owner: backend
    notes: "Integrada como #432 (d755ea69). GET /api/v1/archivos/sin-responsable con archivo.ver + archivo.operar,
      declarado ANTES de :id (si no, se lo tragaria como id). Motivos SIN_OPORTUNIDAD, SIN_ASESOR y
      ASESOR_NO_ELEGIBLE, sin distinguir baja de perdida de permiso, a proposito, para no filtrar el estado de
      la cuenta de un companero. Regla extraida de destinatariosDelAviso (T-254) a booking/domain; booking
      pregunta a crm e identity POR PUERTOS (R4), sin JOIN entre contextos. Sin migracion. AISLAMIENTO: tras
      la auditoria la madre pidio UNA vuelta mas, solo por esto, porque el e2e no cruzaba agencias (CLAUDE.md
      3.1: el aislamiento es el unico sitio donde no se recorta). Ahora es simetrico y NO PUEDE PASAR EN
      VACIO: cada agencia afirma que SI ve su propio huerfano antes de afirmar que no ve el ajeno, asi que una
      lista vacia, un 403 tragado o una ventana recortada rompen la primera mitad. MUTACION MEDIDA: con el
      filtro de tenant_id retirado, test salio VERDE. No es que la prueba no discrimine: es que RLS SOLA sigue
      cubriendo la ruta. Se derriba una capa y la otra aguanta (R2, defensa en profundidad), y ahora esta
      MEDIDO en vez de leido. Lo que NO demuestra: que la asercion cace una fuga, porque no hubo fuga que
      cazar. Cola: T-549 (el filtro va despues del LIMIT, la cifra es un minimo) y T-551."
