  - id: T-377
    title: Mutación que cubra T-307 (M24) y evaluar correr mutaciones-aislamiento.mjs en el CI
    type: test
    phase: 2
    priority: P1
    effort: M
    status: done
    human_required: true
    depends_on:
      - T-307
    acceptance:
      - >-
        HECHA (PR #471, 2026-11-21): el arnes corre en TODO PR contra main, cada noche y a demanda.
                Coste medido 43 s (job 1m45), lo que desmintio la premisa de que eran minutos y permitio quitar
                el filtro de rutas. M24 anadida y DEMOSTRADA en rojo. Resultado: 17 controles verdes, M1-M21
                rojas, M22 no aplicable, M23 y M24 rojas; 23 detectadas, 1 no aplicable
      - |-
        Su primera ejecucion destapo que el arnes moria en M22 y que M23 y M24 nunca corrian: una
                mutacion rota escondia a todas las posteriores. Corregido con cuatro estados por mutacion.
                Lo que queda abierto va en T-577, T-578 y T-579, ninguno bloqueante
      - "Sube de P3 a P1 el 2026-11-21: la reconciliacion de las P1 (PR #463) dejo ver que el arnes de
        mutaciones de aislamiento NO corre en el CI mientras esta tarea dormia en P3. CLAUDE.md §3.1 dice que
        el aislamiento entre agencias es el unico sitio donde no se recorta: una compuerta de aislamiento que
        no se ejecuta no es una compuerta. Lo demas de la tarea no cambia"
      - M24 restaura el cuerpo de proteger_verificacion_del_perfil de T-268 (sin la fijación de fechas) y la
        prueba P-7 debe ponerse en rojo
      - Se ejecutan por primera vez M22 y M23 (hoy nunca corrieron) y se anota el resultado
      - "Decisión escrita: correr packages/database/scripts/mutaciones-aislamiento.mjs en el CI, o por qué no"
    files:
      - packages/database/scripts/mutaciones-aislamiento.mjs
      - .github/workflows/ci.yml
    source: "auditoría de seguridad de T-307 (cola, 2026-11-20): M22 y M23 prueban T-261, ninguna mutación cubre
      T-307, y el script no corre en el CI"
    created_at: 2026-11-21T00:00:00.000Z
    owner: qa
    notes: "Ampliada con T-329: añadir al script las mutaciones de la migración de pagos (quitar el disparador de
      inmutabilidad de pagos, el de travel_files_venta_inmutable, GRANT UPDATE o DELETE sobre pagos a
      viajapro_app, GRANT UPDATE sobre la columna tenants.id, DISABLE TRIGGER) y comprobar que cada una pone
      en rojo su prueba."
