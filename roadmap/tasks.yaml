  - id: T-280
    title: "Comandos de plataforma del registro: generar código de acceso, marcar NIT/RNT verificado y cambiar el
      tope global (ADR-0030 §3.2, §3.3, §3.8)"
    type: security
    phase: 2
    priority: P2
    effort: S
    status: backlog
    depends_on:
      - T-268
    acceptance:
      - "Generar código: secreto de al menos 128 bits de crypto.randomBytes en base32, solo el SHA-256 en
        codigos_de_acceso_al_registro, expira_en en días (14 por defecto), correo OBLIGATORIO (se pide al
        generar y se guarda solo como HMAC) y nota sin datos personales; el secreto se muestra una vez en la
        terminal y nunca se escribe en un registro"
      - "Marcar verificado_en de perfiles_de_agencia por tenant_id, tras comprobar NIT y RNT; registra la
        acción en registros_auditoria sin el NIT. El UPDATE lleva WHERE tenant_id = $1 AND rnt = <el RNT
        comprobado> (y nit = <el NIT comprobado> cuando exista) y el comando exige exactamente una fila, o
        falla: si no, verificaría un RNT que la agencia cambió entre la comprobación y el UPDATE, o no haría
        nada sin avisar (con RLS forzada, un rol dueño que no es superusuario afecta 0 filas si no fija
        app.current_tenant en la misma transacción)"
      - "Decide con qué rol corre. «La plataforma» del disparador de perfiles_de_agencia es el DUEÑO de la
        tabla, que es el rol de las migraciones; usarlo para una operación rutinaria agranda el radio de esa
        credencial. Una función SECURITY DEFINER a secas no sirve (su current_user no es el dueño y el
        disparador anularía la verificación). Opción: un rol NOLOGIN viajapro_verificador, dueño de
        verificar_perfil(tenant, rnt_esperado), con el disparador ampliado para reconocerlo; eso es migración,
        cláusula en R2 y aprobación del propietario"
      - Mientras este comando no exista, el propietario marca a mano la agencia piloto (ver las notas de T-261)
      - Cambiar parametros_del_registro.tope_por_hora dentro de su CHECK, con registro de quién y cuándo
      - Los comandos corren con el rol de plataforma, se niegan con un rol de aplicación y no imprimen cadenas
        de conexión ni secretos; spec de cada guardia
    files:
      - apps/api/src/modules/identity/scripts
      - packages/database/prisma
    source: auditoría de seguridad de ADR-0030, primera vuelta, bloqueante 2 y cola (2026-11-20)
    notes: "Reconciliación 2026-11-21: intacta. Bajada a P2: el registro autoservicio es de la Ola 4 (escala) en
      docs/08-roadmap/09-roadmap-maestro-y-operacion-desatendida.md; el piloto entra con código de acceso y la
      API se niega a arrancar con el autoservicio activo y el índice de apodos global. Su bloqueo («espera
      T-268») estaba obsoleto: T-268 está hecha; pasa a backlog."
    created_at: 2026-11-20T23:30:00.000Z
