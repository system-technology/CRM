  - id: T-054
    title: "API: autenticación por clave en /api/v1/publica/** y gestión de claves en identity (crear mostrando el
      secreto una vez, listar, revocar)"
    type: security
    phase: 1
    priority: P2
    effort: M
    status: backlog
    depends_on:
      - T-053
    acceptance:
      - TenantMiddleware resuelve /api/v1/publica/** solo por Authorization Bearer vjp_live_… vía
        ResolutorDeAcceso; una cookie de sesión en esas rutas = 401; una clave en cualquier otra ruta = 401
      - Ningún tenantId de cuerpo, ruta, consulta o cabecera se lee (spec en apps/api/src/shared/tenant/)
      - POST /api/v1/integraciones/claves (integraciones.administrar) devuelve el secreto una sola vez; GET
        lista prefijo, nombre, ámbitos, último uso, sin secreto ni hash; POST .../:id/revocar hace que la
        siguiente petición con esa clave responda 401
      - "Ámbitos acotados por los permisos de quien crea la clave con permisoQueFalta
        (identity/domain/permisos-incluidos.ts): catalogo:escribir exige catalogo.administrar y catalogo:neto
        exige cotizacion.ver_neto_y_margen; e2e: un rol con integraciones.administrar sin ver_neto_y_margen
        que pide catalogo:neto recibe 403 y no se crea ninguna fila"
      - El atajo x-dev-tenant-id se ignora en /api/v1/publica/** incluso con APP_ENV=local (spec)
      - Comparación del hash en tiempo constante; ultimo_uso_en se escribe como mucho una vez por minuto por
        clave
      - Crear y revocar escriben en registros_auditoria
      - "e2e: una clave de tenant A nunca resuelve tenant B; clave vencida = 401"
      - pnpm --filter @viajapro/api test verde; pnpm compuertas --rapido verde
    files:
      - apps/api/src/shared/tenant/tenant.middleware.ts
      - apps/api/src/shared/puertos/puerto-de-acceso.ts
      - apps/api/src/modules/identity/application/
      - apps/api/src/modules/identity/infrastructure/
      - apps/api/src/modules/identity/interface/
    source: arquitecto:ADR-0017 (importado 2026-10-26; id original T-046)
    created_at: 2026-10-26T00:00:00.000Z
