    source: "auditoria independiente de #410 (T-331), 2026-11-21"
    created_at: 2026-11-21T09:10:00.000Z
    owner: frontend
    notes: "Integrada como #429 (c9a581a4). decimalesDeMoneda en formato.ts lee MONEDAS de @viajapro/domain y
      sustituye los dos moneda === COP ? 0 : 2; decimalesDe y admiteCentavos de cobros-logica delegan en esa
      misma funcion. La prueba es de las que valen: recorre MONEDAS entera contra Money.aDecimal y ADEMAS
      anade KWD (3 decimales) durante su ejecucion, porque con la tabla actual (0/2/2/2) un recorrido a secas
      no distinguiria una tabla propia COP?0:2. La sesion verifico que esa prueba se pone ROJA si formato.ts
      recupera su tabla: se la ha visto fallar, que es lo que convierte una prueba en evidencia. Revisado por
      la madre por ser dinero en pantalla (R13). Dos notas que el PR no decia: con monedas DESCONOCIDAS el
      valor por defecto de decimalesDe pasa de 0 a 2 (sin efecto hoy: el dominio habilita cuatro y la UI no
      deja elegir otra), y de paso se corrige una incoherencia latente, que formato.ts comparaba moneda sin
      normalizar en un camino y con toUpperCase en otro. Quedan vivas otras dos tablas: T-543 y T-544."
