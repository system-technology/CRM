# ═══════════════════════════════════════════════════════════════════
#  Roadmap ejecutable de ViajaPro
#
#  Única fuente de verdad de "qué hay que hacer" (sustituye a la cola de ESTADO.md,
#  que queda como resumen corto: ADR-0016). Lo leen y escriben los agentes y el supervisor
#  a través de tools/roadmap-mcp. Los humanos pueden editarlo a mano; el validador comprueba.
#
#  Estados: backlog → ready → in_progress → review → done | blocked | dropped
#  Prioridad: P0 (producción rota/seguridad) P1 (esta fase) P2 (siguiente) P3 (idea)
#  Esfuerzo: S (<1 ciclo) M (1-2 ciclos) L (3+ ciclos → dividir antes de empezar)
#  Una tarea = UN carril (a: backend, b: frontend, i: integradora), con acceptance verificable
#  y `files` que existan. Migraciones, RLS, cifrado, infra y dependencias son del Owner.
# ═══════════════════════════════════════════════════════════════════

