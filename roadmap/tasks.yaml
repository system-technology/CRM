  - id: T-041
    title: Contrato PropuestaDeCatalogo y plantillas de sistema en contracts; núcleo puro validar y planificar en
      quoting/domain (ADR-0017 §1-§3)
    type: feature
    phase: 1
    priority: P1
    effort: M
    status: done
    depends_on: []
    unblocks:
      - T-030
    acceptance:
      - packages/contracts/src/propuesta-de-catalogo.ts exporta PropuestaDeCatalogo (.strict(), version 1,
        origen PANTALLA|ARCHIVO|API|IA, 1..500 productos), ProductoPropuesto, TarifaPropuesta, Procedencia e
        InformeDeCatalogo; un cuerpo con tenantId es rechazado por parse
      - "Refinamientos: origen API sin codigo en un producto es inválido; origen IA con un precio sin
        procedencia.fuente y procedencia.fragmento es inválido (spec en
        packages/contracts/src/propuesta-de-catalogo.spec.ts)"
      - packages/contracts/src/plantillas-de-catalogo.ts exporta DescriptorDePlantilla y PLANTILLAS_DE_SISTEMA
        con cuatro entradas (excursion-un-dia, pasadia, pasanoche, paquete-con-hotel), version 1, claves de
        columna estables; los cuatro se exportan desde packages/contracts/src/index.ts
      - "Función pura validarYPlanificar(propuesta, catalogoActual, permisos) en
        apps/api/src/modules/quoting/domain/: noches > dias = ERROR; POR_PERSONA con cubrePasajeros != 1 =
        ERROR; dos vigencias abiertas de igual longitud solapadas = ERROR VIGENCIA_EMPATADA usando
        resolverVigencia de @viajapro/domain; neto sin permiso = ERROR NETO_SIN_PERMISO; producto sin
        vigencias = AVISO SIN_PRECIO"
      - "Clave natural: nombre normalizado + noches; «Piangüita + Ballenas» con 0 y con 1 noche son dos CREAR;
        un nombre que casa con dos paquetes actuales = ERROR PAQUETE_AMBIGUO; misma propuesta contra el
        catálogo ya igual = todo SIN_CAMBIOS; la huella es estable para la misma entrada y cambia con el
        tenantId"
      - Campos de M2 presentes en la propuesta producen AVISO CAMPO_NO_SOPORTADO_AUN y no ERROR
      - ProductoPropuesto tiene opcionesDeSalida [{etiqueta, horaSalida?, horaRegreso?, puntoDeEncuentro?}] y
        no tiene horaSalida ni horaRegreso sueltos; TarifaPropuesta.opcionDeSalida debe nombrar una etiqueta
        del mismo producto (si no, ERROR OPCION_DE_SALIDA_DESCONOCIDA); etiqueta repetida en un producto =
        ERROR
      - Procedencia.confianza es number 0..1 (no enum); el spec lo fija
      - pnpm --filter @viajapro/api test verde; pnpm compuertas --rapido verde
    files:
      - packages/contracts/src/propuesta-de-catalogo.ts
      - packages/contracts/src/plantillas-de-catalogo.ts
