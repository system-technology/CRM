    title: "API: alta atómica de agencia (POST /api/v1/auth/agencias) con crear_agencia, siembra por puertos,
      dueño, auditoría y outbox (ADR-0030 F3)"
    type: security
    phase: 2
    priority: P1
    effort: M
    status: blocked
    blocked_reason: "Espera la aceptación de ADR-0030, T-262, T-263 y T-264"
    depends_on:
      - T-262
      - T-263
      - T-264
    acceptance:
      - Una transacción de viajapro_app en el orden de ADR-0030 §3.4; el contexto lo fija crear_agencia y se
        comprueba antes de sembrar
      - Puerto SembradorDeAgenciaNueva declarado en identity; crm (etapas, motivos) y quoting (formatos, política)
        lo implementan con siembra-de-tenant.ts; ningún import entre módulos (R4)
      - Contrato Zod strict sin campo de tenant; un tenantId en el cuerpo = 400; exige sesión e identidad
        verificada, no tenant activo
      - Errores por SQLSTATE (22023→422, VPR01→409, VPR02→503 con Retry-After); quien crea queda DUENO y la
        sesión queda con la agencia nueva como activa
      - registros_auditoria agencia.creada sin nombre, correo ni NIT; outbox identity.agencia_creada v1 con
        tenantId y origen
      - "e2e: siembra que falla no deja fila en tenants; slug repetido no da acceso a la agencia existente;
        segunda agencia en prueba = 409"
      - Revisión de auditor-seguridad sin bloqueantes antes de integrar
    files:
      - apps/api/src/modules/identity
      - apps/api/src/modules/crm
      - apps/api/src/modules/quoting
      - apps/api/src/shared/tenant/tenant.middleware.ts
      - packages/contracts/src
    source: arquitecto:ADR-0030 §1 y §3 (2026-11-20)
    created_at: 2026-11-20T23:00:00.000Z
    owner: backend
