    title: Comprobar la cabecera Origin en toda mutación de la API, no solo en auth y en el socket
    type: security
    phase: 1
    priority: P1
    effort: M
    status: done
    acceptance:
      - Un POST, PUT, PATCH o DELETE con una cabecera Origin que no esté en la lista permitida responde 403,
        en cualquier controlador
      - Las peticiones sin Origin (servidor a servidor, el webhook de Meta firmado) siguen funcionando
      - Un test en apps/api/src/shared/red/ cubre origen permitido, origen ajeno y ausencia de origen
      - pnpm compuertas --rapido verde
    files:
