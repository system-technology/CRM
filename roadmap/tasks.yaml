      intentos, codigo); (4) barrer() rota el punto de inicio en cada pasada.
      COLA (necesita migracion/SECURITY DEFINER, no hecha): metrica de entregas abandonadas por
      consumidor (como medir_cola_de_salida) y quitar el LIMIT 500 fijo de
      tenants_con_eventos_por_entregar: la rotacion cubre la lista devuelta, no las agencias que
      la funcion deje fuera. Duenos: datos (funcion) y backend (exposicion en /salud).
