    notes: "TRIAJE 2026-11-21. La sesion de T-542 propuso DROPPED porque el job navegador la sustituye. La madre
      lo CAMBIA a backlog. Motivo: el propio informe reconoce que tal como esta escrita no se cumple, porque
      no hay bitacora de hallazgos de un recorrido manual. Descartarla perderia justo lo que mas le falta al
      proyecto: que una persona recorra el producto antes de ensenarselo a una agencia. Un job de CI comprueba
      que el flujo no se rompe; NO comprueba que el producto se entienda, ni encuentra lo que nadie penso en
      automatizar. ALCANCE REDUCIDO: recorrido manual con bitacora de hallazgos ANTES de la primera
      demostracion al piloto. AVISO OPERATIVO: una rama cuyo nombre contenga T-126 la cierra sola
      (cerrar-tarea.yml)."
