    source: "T-343: los criterios «cotizaciones abiertas por antigüedad» y «cobros por cobrar» del asesor no se
      pueden cumplir en la web sin un dato servido por asesor"
    created_at: 2026-11-21T23:00:00.000Z
    owner: backend
    notes: "Integrada como #428 (aa38bdf9). El servidor sirve las cotizaciones abiertas y el saldo por cobrar DEL
      ASESOR; nacio porque T-343 se nego a filtrar listas de agencia en el cliente. AUDITORIA INDEPENDIENTE DE
      LA MADRE (alcance entre asesores, R13): SIN BLOQUEANTES. El asesorId que llega del cliente pasa siempre
      por alcanceDeReporte(): sin reportes.ver_agencia es 403, no un recorte en silencio. El acierto es que la
      firma del puerto no tiene valor por defecto, asi que olvidar el filtro no compila, y olvidarlo era
      devolver toda la agencia. Verificados R1/R2 (parametrizado dentro de la transaccion con tenant,
      tenant_id explicito ademas de RLS, sin rol postgres), R4 (la frontera analytics/payments la sostiene una
      prueba que lee las fuentes) y R8 (entero en unidad minima, monedas agrupadas sin TRM, saldos a favor
      descartados en vez de restados). El e2e cubre dos agencias y dos asesores con aserciones negativas sobre
      la respuesta cruda. HALLAZGO QUE CASI BLOQUEA, ahora T-537 (P1): porCobrar se sirve sin exigir cobro.ver
      mientras las pantallas de cobro si lo exigen, lo que contradice ADR-0035 4. No bloquea porque la madre
      verifico que NO existe endpoint para componer roles a medida, asi que hoy ninguna agencia puede llegar a
      ese estado. Resto de la cola: T-538 a T-541."
  - id: T-529
