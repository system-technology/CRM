        search_path = '', sin SQL dinámico; filtra por prefijo y hash, no revocada, no vencida y tenant no
        suspendido; en la migración el orden es REVOKE ALL FROM PUBLIC, GRANT EXECUTE TO viajapro_app y
        después OWNER TO viajapro_claves
      - registros_auditoria.clave_api_id nulable con foránea compuesta a claves_api
      - "'integraciones.administrar' en el CHECK roles_permisos_del_catalogo y en PERMISOS; concedido solo a
        DUENO"
      - "aislamiento.spec.ts: ningún rol de login puede SELECT ni escribir directorio_claves_api;
        viajapro_claves no tiene BYPASSRLS ni LOGIN ni miembros; resolver_clave_api solo la ejecuta
        viajapro_app; el inventario de funciones SECURITY DEFINER pasa de 11 a 13 y una aserción falla si
        alguna gana SQL dinámico o EXECUTE a otro rol; un UPDATE de claves_api.tenant_id falla"
      - pnpm db:migrate && pnpm --filter @viajapro/database test verde; pnpm compuertas --rapido verde
    files:
