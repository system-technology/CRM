  - id: T-372
    title: "ADR-0031 PR 1: ejecutar el arnés de mutaciones de aislamiento (M17 y M21) y dejar el resultado; la
      migración y AP1-AP12 ya están"
    type: security
    phase: 1
    priority: P1
    effort: M
    status: done
    human_required: true
    acceptance:
      - "Ya existe: migración 20261120150000_apodo_de_ingreso (usuarios.apodo, accesos_identidad.apodo,
        disparador, CHECK del dominio .invalid) y AP1-AP12 en packages/database/tests/aislamiento.spec.ts"
      - "Falta: correr packages/database/scripts/mutaciones-aislamiento.mjs contra una base y dejar en la
        bitácora que M17 y M21 salen en rojo (el script las define pero ningún job del CI lo ejecuta y no hay
        rastro de una corrida)"
    files:
      - packages/database/tests/aislamiento.spec.ts
      - packages/database/prisma/seed.ts
    source: ADR-0031 (cola, 2026-11-20)
    created_at: 2026-11-20T20:30:00.000Z
    owner: datos
    notes: "TRIAJE 2026-11-21. Se ofrecio cerrarla como done moviendo su criterio pendiente a T-377. La madre
      RECHAZA esa salida. El criterio pendiente es que el arnes de mutaciones de aislamiento (M17 y M21) NUNCA
      SE HA EJECUTADO: no corre en el CI y no hay rastro de que se corriera tras el apodo. Mover un criterio
      de aislamiento no ejecutado a otra tarea es aplazarlo con mejor aspecto. CLAUDE.md 3.1 dice que el
      aislamiento es el unico sitio donde no se recorta, y el 2026-11-21 ya aparecieron dos huecos de
      verificacion por confiar en lecturas (T-547 y el e2e de T-529). Se queda backlog hasta que el arnes
      corra. Lo hecho si esta en main: migracion 20261120150000, AP1-AP12 en aislamiento.spec.ts. ||
      Reconciliación 2026-11-21: se mantiene la decisión del triaje de la madre (no cerrarla moviendo el
      criterio a T-377). Solo se estrecha el texto a lo que falta. || MEDIDA Y CERRADA 2026-11-21 por la madre
      del lote nocturno. El arnes YA se ejecuta en todo PR desde T-377. En la corrida 44934621499 (rama
      i/tablero-y-seguimientos-del-arnes, ya integrada en main, 18:18 UTC) M17 (el disparador NO borra el par
      OLD al cambiar identidad_id o tenant_id) y M21 (el disparador sin la rama del apodo: un cambio de apodo
      no llega al indice) salieron las dos ROJAS, que es exactamente el criterio que faltaba. Resumen de esa
      corrida: 23 mutaciones detectadas, 1 no aplicable. Rastro en la bitacora del lote."
