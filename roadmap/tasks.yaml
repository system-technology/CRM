  - id: T-002
    title: Límite de tasa en la API fuera del flujo de autenticación
    type: security
    phase: 1
    priority: P1
    effort: M
    status: backlog
    acceptance:
      - Un cliente que supera N peticiones por minuto a un endpoint de negocio recibe 429 con la cabecera
        Retry-After
      - El límite se mide por tenant y por IP y su valor sale de configuración, no de una constante en el
        código
      - El webhook firmado de WhatsApp no queda limitado por este mecanismo
      - Un test en apps/api/src/shared/ demuestra el 429 y la recuperación tras la ventana
    files:
      - apps/api/src/shared/red/
      - apps/api/src/main.ts
