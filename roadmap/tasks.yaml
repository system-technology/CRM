        niega por defecto la verificación, con las pruebas P-1 a P-6 de aislamiento.spec.ts (#321, ADR-0030
        §3.3: el RNT NO va en tenants)"
      - "AjustesDeAgencia con rnt y rntVerificado; el PATCH acepta rnt (CambiarAjustesDeAgencia, estricto:
        ningún cuerpo puede fijar la verificación) con usuarios.administrar, y la e2e prueba aislamiento entre
        agencias (#322)"
      - Configuración con el bloque del RNT en sus tres estados, y la propuesta al viajero
        (/cotizaciones/[id]/imprimir) lo imprime solo si está verificado (#324)
    files:
      - packages/database/prisma
      - packages/contracts/src/identidad.ts
      - apps/api/src/modules/identity
      - apps/web/src/components/configuracion/bloque-rnt.tsx
      - apps/web/src/app/cotizaciones/[id]/imprimir
    source: propuesta al viajero (auditoría UX 2026-11-20 I3; Ley 300 de 1996 exige el RNT en la publicidad)
    created_at: 2026-11-20T22:00:00.000Z
    owner: backend
    started_at: 2026-11-20T22:00:00.000Z
    notes: "Hecho en tres PR: #321 (migración, aprobada por el propietario), #322 (API) y #324 (web). Con la API
      real NADIE tiene el RNT verificado hasta que exista T-280: el propietario marca la agencia piloto a mano
      con UPDATE perfiles_de_agencia SET verificado_en = now() WHERE tenant_id = $1 AND rnt = <el RNT
      comprobado>, exigiendo una sola fila, con el rol dueño. Supuesto sin verificar contra la fuente oficial:
      el RNT son solo dígitos, de 1 a 10. Desviaciones de ADR-0030: la tabla solo trae rnt y verificado_en
      (nit, digito_verificacion y razon_social llegan con T-268), y el disparador CONSERVA verificado_en si el
      RNT no cambia, en vez de ponerlo en NULL siempre que escribe viajapro_app (si no, cualquier UPDATE de la
      API lo borraría). La tarea original decía «columna en tenants»: era un error, contradecía el ADR
      aceptado."
