      - completar consume el intento antes de comparar con UPDATE ... SET intentos_restantes =
        intentos_restantes - 1 WHERE correo_hmac = $1 AND intentos_restantes > 0 AND expira_en > now()
        RETURNING; compara en tiempo constante; al acertar, DELETE por id y solo sigue si borró 1 fila; 10
        fallos por correo en 24 h bloquean incluso el código correcto
      - completar nunca reutiliza ni ata una identidad existente (error genérico); usa una variante
        crearVerificadaNueva(tx, …) que ante P2002 lanza el error genérico (la crearVerificada actual
        reutiliza la identidad, identidades.prisma.ts:42-47); e2e de la carrera completar contra completar y
        contra aceptar invitación; crea la identidad y las aceptaciones de TERMINOS y AVISO_DE_PRIVACIDAD con
        versión vigente y canal WEB_REGISTRO en la misma transacción del pool de identidad; sin ambas = 422;
        inicia sesión por Better Auth sin crear sesiones a mano
      - Las dos ramas de solicitar encolan un trabajo con la misma forma en el mismo punto, por la cola de
