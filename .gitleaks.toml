# Configuración del escáner de secretos.
#
# Parte de las reglas por defecto de gitleaks y solo les quita ruido concreto. La regla R6 del
# proyecto dice que ningún secreto entra al repositorio, así que esta compuerta tiene que poder
# ponerse en rojo de verdad: lo que se silencie aquí hay que justificarlo.

[extend]
useDefault = true

# -----------------------------------------------------------------------------
# Marcadores de plantilla, permitidos POR LA FORMA DEL VALOR y en cualquier archivo.
#
# **Deliberadamente NO se usa `paths`.** Se intentó dos veces y las dos estaban mal:
#
#   1. Con `paths` + `regexes` y el `condition` por omisión —que es **OR**—, bastaba coincidir
#      en la ruta: el archivo quedaba exento entero y las expresiones eran decorativas.
#   2. Añadir `condition = "AND"` tampoco bastó. Se comprobó empujando una clave de AWS con
#      forma válida a `.env.example`: **el job siguió en verde.** `paths` actúa como filtro de
#      archivo *antes* de aplicar las reglas, así que nombrar la ruta excluye ese archivo pase
#      lo que pase.
#
# La consecuencia importaba de verdad: el hook local **también** exceptúa `.env.example`, así
# que un secreto pegado ahí no lo habría visto ninguna de las dos capas.
#
# Permitir por forma del valor, y no por archivo, resuelve las dos cosas. Las tres expresiones
# son inofensivas en cualquier sitio —un valor vacío no filtra nada, y las otras dos son
# literales fijos de este repositorio—, y `.env.example` **se sigue escaneando entero** con las
# reglas por defecto.
#
# Si alguien añade aquí una entrada nueva, la prueba es la misma que descubrió esto: pegar una
# credencial con forma válida en el archivo que se quiera exceptuar y comprobar que el job se
# pone ROJO. Una lista de permitidos que nadie ha intentado romper no está verificada.
# -----------------------------------------------------------------------------
[allowlist]
description = "Marcadores de plantilla y contraseña local pública, nunca credenciales reales"
# Estas expresiones se comparan contra **el secreto detectado**, no contra la línea. Intentarlo
# con la línea completa (`regexTarget = "line"` y un ancla `^NOMBRE=`) no funcionó: el job seguía
# marcando los propios marcadores que debía permitir.
#
# Por eso aquí van los literales a secas. Son dos cadenas fijas de este repositorio, lo bastante
# específicas para no enmascarar nada real: ninguna credencial de verdad contiene «cambiar-por-»
# ni «desarrollo-local-sin-valor».
regexes = [
  '''cambiar-por-[a-z0-9-]+''',
  '''desarrollo-local-sin-valor''',
]
