# Configuración del escáner de secretos.
#
# Parte de las reglas por defecto de gitleaks y solo les quita ruido concreto. La regla R6 del
# proyecto dice que ningún secreto entra al repositorio, así que esta compuerta tiene que poder
# ponerse en rojo de verdad: lo que se silencie aquí hay que justificarlo.

[extend]
useDefault = true

# -----------------------------------------------------------------------------
# `.env.example` es una PLANTILLA: existe para enseñar qué variables hacen falta.
# Sus valores son marcadores, no credenciales.
#
# **No se silencia el archivo entero, a propósito.** Si alguien pega ahí un secreto de verdad
# —que es un error fácil y ya nos ha pasado con credenciales en otros sitios—, tiene que saltar.
# Por eso el permiso es por FORMA del valor, no por nombre de archivo:
#
#   - vacío              → no hay nada que filtrar
#   - `cambiar-por-...`  → la convención del propio archivo para «pon aquí lo tuyo»
#   - la contraseña de desarrollo local, que es pública a propósito y solo vale contra localhost
#
# Cualquier otro valor en ese archivo se sigue escaneando con las reglas por defecto.
# -----------------------------------------------------------------------------
[allowlist]
description = "Marcadores de la plantilla de entorno, nunca credenciales reales"

# `condition = "AND"` NO es opcional, y omitirlo volvía falsa la promesa de arriba.
# El valor por omisión de gitleaks es **OR**: con `paths` y `regexes` declarados a la vez,
# bastaba coincidir en la ruta para permitir CUALQUIER línea del archivo, y las tres
# expresiones de abajo quedaban de adorno. Es decir, la versión anterior silenciaba el
# archivo entero — exactamente lo que su propio comentario decía no hacer.
#
# Lo encontró el agente `integrador` leyendo el archivo, no ejecutándolo, y lo dejó como
# hipótesis falsable. Confirmado después en la documentación de gitleaks.
condition = "AND"

paths = ['''\.env\.example$''']
regexTarget = "line"
regexes = [
  '''^[A-Z0-9_]+=\s*(#.*)?$''',
  '''^[A-Z0-9_]+=cambiar-por-[a-z0-9-]+''',
  '''^[A-Z0-9_]+=desarrollo-local-sin-valor''',
]
