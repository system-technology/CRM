# Entorno de desarrollo en la nube (GitHub Codespaces) o en cualquier host con Docker.
# Valores de DESARROLLO sin secreto: la base solo existe dentro del contenedor.
# Los cuatro servicios comparten la red de `db`, asi que todo es `localhost` y el
# `.env` que genera `pnpm dev:nube` sirve igual que en la maquina local.
name: viajapro-nube

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    network_mode: service:db
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: viajapro
      POSTGRES_PASSWORD: viajapro
      POSTGRES_DB: viajapro
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U viajapro -d viajapro']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: service:db
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    network_mode: service:db

volumes:
  postgres-data:
  redis-data:
