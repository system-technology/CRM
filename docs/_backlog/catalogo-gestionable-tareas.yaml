# ═══════════════════════════════════════════════════════════════════
#  Catálogo gestionable por la agencia — descomposición de ADR-0017
#
#  Formato idéntico al de roadmap/tasks.yaml, para copiar el bloque `tasks` tal cual.
#  Ids T-016..T-029: son los siguientes libres en main a 2026-10-26 (máximo T-015). Si otra rama
#  añadió tareas antes de integrar esto, renumerar entero (depends_on incluido).
#
#  Carril: el supervisor (scripts/ciclo.mjs, carrilDeTarea) lo DEDUCE de `files` vía ownership.json;
#  packages/contracts es compartido y no cuenta. Por eso toda tarea lleva al menos un archivo de su
#  carril: una tarea con solo contracts no la elegiría nadie.
#
#  human_required: el supervisor NO lee este campo (verificado). Las tareas del Owner van además
#  con status `blocked` y blocked_reason, que sí las saca de las candidatas. El Owner las pasa a
#  `done` al aplicar la migración.
#
#  Orden de resultado visible:
#    T-016 (Owner, S) → T-017 → T-018 → T-019 → T-020  = listar y crear una excursión de un día desde la web
#    T-021 → T-022 → T-023 → T-024                     = importar el CSV de ejemplo desde la web
#    T-025 → T-026                                     = edición de tarifas e historial de precio
#    T-027 (Owner, M) → T-028 → T-029                  = promo, cargos en destino, horario, código,
#                                                        campos propios y formato de viaje
# ═══════════════════════════════════════════════════════════════════

