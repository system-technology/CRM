# ═══════════════════════════════════════════════════════════════════
#  Catálogo gestionable por la agencia — descomposición de ADR-0017 (cuatro canales, un núcleo)
#
#  Formato idéntico al de roadmap/tasks.yaml, para copiar el bloque `tasks` tal cual.
#  Ids T-032..T-050. T-016..T-031 los ocupa la cola del carril frontend (rama i/T-000-cola-frontend,
#  PR en curso; NO verificado aquí: esa rama no estaba disponible al redactar). De esa cola se citan:
#    T-017 cotizador de excursiones de un día · T-018 tarjeta y ficha de excursión
#    T-028 ajuste promo_vencida en Configuración · T-029 asistente de importación
#    T-030 descarga de plantillas · T-031 gestión CRUD del catálogo
#  Cada tarea de backend dice en `unblocks` qué tarea de frontend libera (campo informativo; el
#  supervisor no lo lee). Si la numeración cambia al integrar, renumerar entero (depends_on incluido).
#
#  Carril: scripts/ciclo.mjs (carrilDeTarea) lo DEDUCE de `files` vía ownership.json;
#  packages/contracts y packages/domain son compartidos y no cuentan. Toda tarea lleva al menos un
#  archivo de su carril.
#
#  human_required: el supervisor NO lo lee (verificado: grep en scripts/ciclo.mjs). Las tareas del
#  Owner van además con status `blocked` y blocked_reason, que sí las saca de las candidatas.
#  M1 y M2 están autorizadas por el propietario (2026-10-26); M2 incluye opciones_de_salida (revisión
#  de experto-turismo). M3 (T-045) sigue bloqueada hasta implementar ADR-0017 §6.2 corregido (S1, S2).
#  La IA (T-050) sigue bloqueada hasta alinear el PR #37 con ADR-0017 §7.
#
#  Orden de resultado visible:
#    T-032 (Owner M1) → T-033 → T-034 → T-035 → T-036     = crear una excursión de un día desde la web
#                                                          (libera T-031, T-018) y plantilla CSV (T-030)
#    T-037 → T-038 → T-039                                 = importar CSV (libera T-029) e historial
#    T-040 (Owner M2) → T-041 → T-042 → T-043 → T-044      = campos extendidos, formatos, promo_vencida
#                                                          (libera T-028), Excel
#    T-045 (Owner M3) → T-046 → T-047 → T-048              = API pública con claves por agencia
#    T-049 → T-050                                         = IA: frontera ahora, pantalla al final
# ═══════════════════════════════════════════════════════════════════

