  - id: T-045
    title:
      'Migración M3: rol viajapro_claves, claves_api por tenant, directorio_claves_api global, disparador y
      resolver_clave_api, registros_auditoria.clave_api_id y permiso integraciones.administrar (ADR-0017 §6.2)'
    type: security
    phase: 1
    priority: P2
    effort: M
    status: blocked
    blocked_reason: 'human_required: migración del Owner. Bloqueada hasta implementar ADR-0017 §6.2 tal como quedó tras la revisión de auditor-seguridad (S1, S2)'
    human_required: true
    depends_on: [T-040]
    acceptance:
      - 'Rol viajapro_claves NOLOGIN NOBYPASSRLS; ningún rol de login es miembro suyo'
      - 'claves_api con tenant_id y RLS (USING y WITH CHECK por 001), UNIQUE (id, tenant_id), prefijo único,
        hash_secreto, ambitos text[], expira_en, revocada_en; ninguna columna guarda el secreto'
      - "directorio_claves_api (prefijo PK, hash_secreto bytea, tenant_resuelto_id, clave_id, ambitos, expira_en,
        revocada_en) SIN columna tenant_id, propiedad de viajapro_claves, declarada en excepciones_rls con '{}' para
        viajapro_app, viajapro_altas, viajapro_webhook y viajapro_identidad; el literal de aislamiento.spec.ts se amplía
        con ella (R1)"
      - 'Disparador SECURITY DEFINER de viajapro_claves sobre claves_api mantiene el directorio en INSERT y UPDATE
        (revocar, vencer) en la misma transacción y rechaza cualquier UPDATE de tenant_id'
      - "resolver_clave_api(p_prefijo, p_hash) propiedad de viajapro_claves, LANGUAGE sql STABLE STRICT, SET
        search_path = '', sin SQL dinámico; filtra por prefijo y hash, no revocada, no vencida y tenant no suspendido;
        en la migración el orden es REVOKE ALL FROM PUBLIC, GRANT EXECUTE TO viajapro_app y después OWNER TO
        viajapro_claves"
      - registros_auditoria.clave_api_id nulable con foránea compuesta a claves_api
      - "'integraciones.administrar' en el CHECK roles_permisos_del_catalogo y en PERMISOS; concedido solo a DUENO"
      - 'aislamiento.spec.ts: ningún rol de login puede SELECT ni escribir directorio_claves_api; viajapro_claves no
        tiene BYPASSRLS ni LOGIN ni miembros; resolver_clave_api solo la ejecuta viajapro_app; el inventario de
        funciones SECURITY DEFINER pasa de 11 a 13 y una aserción falla si alguna gana SQL dinámico o EXECUTE a otro
        rol; un UPDATE de claves_api.tenant_id falla'
