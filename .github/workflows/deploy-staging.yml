# Despliegue de STAGING (ADR-0013 §6 y §7, topologia de ADR-0028). Publica lo que ya entro en `main` y paso el CI:
#   migrate deploy (rama de staging, rol propietario) -> deploy hook de la API (Render) -> sonda /salud/listo -> deploy hook de la web (Vercel)
#
# Sin secretos del Environment `staging` el workflow FALLA (T-204): un despliegue que no
# desplego no puede verse verde, porque nadie lo mira y parece que staging esta al dia. No es un
# check obligatorio de `main`, asi que el rojo no bloquea a nadie. Para decir «todavia no hay
# staging» a proposito, definir la variable del repositorio STAGING_DESPLIEGUE=desactivado:
# entonces termina en verde pero con un resumen «OMITIDO» inequivoco, y se puede quitar al conectar.
#
# Lo que usa y lo que NO usa:
#   - Secretos del Environment `staging` (limitado a `main`): DIRECT_URL, RENDER_DEPLOY_HOOK_API y
#     VERCEL_DEPLOY_HOOK_WEB. Topologia: ADR-0028 (Neon + Vercel + un solo proceso en Render).
#   - Nunca la clave de API de Render ni el token de Vercel: valen para toda la cuenta.
#   - Variable (no secreto) del repositorio: STAGING_API_URL, obligatoria: es la sonda que separa API y web.

name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false # un despliegue a medias no se cancela: se espera

permissions:
  contents: read

env:
  NODE_VERSION: '22.20.0'
  PNPM_VERSION: '9.12.0'

jobs:
  migrar:
    name: migrar
    runs-on: ubuntu-latest
    # Solo un push a main con el CI en verde. Los PR y las ramas no despliegan jamas.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment: staging
    outputs:
      listo: ${{ steps.secretos.outputs.listo }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Comprobar que hay secretos
        id: secretos
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DESPLIEGUE: ${{ vars.STAGING_DESPLIEGUE }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            if [ "$DESPLIEGUE" = "desactivado" ]; then
              echo "## Staging: OMITIDO (no se desplego nada)" >> "$GITHUB_STEP_SUMMARY"
              echo "Faltan los secretos del Environment \`staging\` y STAGING_DESPLIEGUE=desactivado. No se migro ni se desplego." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Staging OMITIDO: sin secretos y STAGING_DESPLIEGUE=desactivado. No se desplego nada."
            else
              echo "## Staging: NO DESPLEGADO" >> "$GITHUB_STEP_SUMMARY"
              echo "Faltan los secretos del Environment \`staging\` (DIRECT_URL). Ver docs/07-ingenieria/despliegue-neon-vercel-render.md. Para omitirlo a proposito: variable STAGING_DESPLIEGUE=desactivado." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Faltan los secretos del Environment 'staging' (DIRECT_URL): NO se migro ni se desplego. Definir los secretos o STAGING_DESPLIEGUE=desactivado."
              exit 1
            fi
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secretos.outputs.listo == 'true'
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # ADR-0013 §6: hoy una rama sin integrar migro y rompio la compuerta.
      - name: Negarse si el SHA no esta en main
        if: steps.secretos.outputs.listo == 'true'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::El SHA $SHA no es ancestro de origin/main. No se migra."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.secretos.outputs.listo == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secretos.outputs.listo == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar
        if: steps.secretos.outputs.listo == 'true'
        # Sin scripts de instalacion: ningun paquete corre codigo propio en este job, y la
        # credencial del rol propietario solo existe en el paso de migrar.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Conexion DIRECTA con el rol propietario: las migraciones no pasan por el pooler.
      # La migracion tiene que ser compatible con el codigo anterior (expandir, luego contraer).
      - name: prisma migrate deploy
        if: steps.secretos.outputs.listo == 'true'
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  desplegar:
    name: desplegar
    runs-on: ubuntu-latest
    needs: migrar
    if: needs.migrar.outputs.listo == 'true'
    environment: staging
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      HOOK_WEB: ${{ secrets.VERCEL_DEPLOY_HOOK_WEB }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Un hook es una URL con un token: se llama sin imprimirla y sin `-v`.
      # Orden (ADR-0028): primero la API en Render (que puede traer migraciones esperando), se
      # espera a que conteste, y solo entonces la web en Vercel. Asi la web nueva nunca habla con
      # una API vieja que no entiende sus contratos.
      - name: Comprobar que estan los dos hooks
        run: |
          faltan=""
          [ -z "$HOOK_API" ] && faltan="${faltan} RENDER_DEPLOY_HOOK_API"
          [ -z "$HOOK_WEB" ] && faltan="${faltan} VERCEL_DEPLOY_HOOK_WEB"
          if [ -n "$faltan" ]; then
            echo "::error::Falta el secreto del Environment staging:${faltan}. NO se despliega nada."
            echo "## Staging: despliegue INCOMPLETO, sin hook:${faltan}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$STAGING_API_URL" ]; then
            echo "::error::Sin la variable STAGING_API_URL no hay sonda: no se puede esperar a la API antes de la web."
            echo "## Staging: NO desplegado (falta STAGING_API_URL)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Desplegar la API (Render)
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK_API" > /dev/null
          echo "Despliegue de la API solicitado."

      # Limite conocido: el hook responde al instante y la API anterior sigue sana hasta que la
      # nueva pasa su health check; esto confirma que la API contesta y que el rol no salta RLS.
      # La reversion automatica la hace Render si la nueva no pasa `/salud/listo`.
      - name: Esperar la sonda de la API
        run: |
          sleep 60
          for i in $(seq 1 20); do
            if curl --fail --silent --max-time 10 "$STAGING_API_URL/salud/listo" | grep -q '"estado":"ok"'; then
              echo "La API de staging esta lista."
              exit 0
            fi
            sleep 15
          done
          echo "::error::La API de staging no quedo lista en 6 minutos. NO se despliega la web."
          echo "## Staging: API sin sonda; la web NO se desplego (${SHA})" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Desplegar la web (Vercel)
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK_WEB" > /dev/null
          echo "Despliegue de la web solicitado."

      - name: Sonda final
        run: |
          curl --fail --silent --max-time 10 "$STAGING_API_URL/salud/listo" | grep -q '"estado":"ok"'
          echo "## Staging: desplegado y verificado (${SHA})" >> "$GITHUB_STEP_SUMMARY"
