name: Reevaluar compuerta de rutas protegidas

# Cuando el Owner aprueba (o se descarta una revisión) hay que volver a correr `rutas-protegidas`
# sobre EL MISMO commit del PR. Un workflow disparado por `pull_request_review` publicaría su
# resultado contra otro SHA y no satisfaría el check obligatorio; en cambio, repetir la ejecución
# original conserva el commit. Este job NO es un check obligatorio y no juzga nada.
# Limitación: en PR desde forks el token es de solo lectura y esto no puede repetir la ejecución
# (el repositorio trabaja con ramas propias).

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write
  contents: read

jobs:
  reevaluar:
    name: reevaluar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repetir la última ejecución de rutas-protegidas sobre este commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/actions/workflows/rutas-protegidas.yml/runs?head_sha=$SHA&event=pull_request_target&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$id" ]; then
            echo "::warning::No hay ejecución previa de rutas-protegidas para $SHA; la lanzará el próximo push."
            exit 0
          fi
          gh run rerun "$id" || echo "::warning::No se pudo repetir la ejecución $id (¿sigue en curso? entonces ya leerá la revisión)."
