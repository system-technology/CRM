# Compuertas de integración, en servidor.
#
# Los hooks locales son una barandilla contra el accidente; esto es lo que de verdad impide que
# entre algo roto a `main`. Configurar estos checks como obligatorios en la protección de rama:
# ver .github/PROTECCION-DE-RAMA.md
#
# NOTA: mientras el proyecto esté en Fase 0 no hay código de aplicación, así que varios pasos
# no tienen nada que hacer. Se dejan escritos para que la compuerta exista desde el primer commit
# y no haya que "acordarse" de montarla después.

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.20.0'
  PNPM_VERSION: '9.12.0'

jobs:
  # ---------------------------------------------------------------------------
  secretos:
    name: secretos
    runs-on: ubuntu-latest
    # El escaneo de un PR necesita leer la lista de commits del PR por la API, y el token
    # por omisión solo trae `contents`. Sin esto el job muere con un 403 «Resource not
    # accessible by integration» — que NO es un hallazgo de secreto, pero se ve igual de
    # rojo. Peor: parece que la compuerta funciona cuando en realidad no llegó a escanear.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # historial completo: un secreto en un commit intermedio cuenta igual

      # El binario de gitleaks es gratuito; gitleaks-action exige licencia de pago en
      # organizaciones («missing gitleaks license»). Versión fijada y verificada por SHA-256.
      - name: Escanear el historial en busca de secretos
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

  # ---------------------------------------------------------------------------
  calidad:
    name: ${{ matrix.tarea }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # queremos ver TODAS las que fallan, no solo la primera
      matrix:
        tarea: [typecheck, lint, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sin cliente de Prisma generado, sus tipos son `any` y `typecheck` falla con
      # TS7006 en cada `.map()` sobre un modelo. No hace falta base viva: `generate`
      # solo lee el esquema, pero el esquema declara las dos URLs y Prisma valida que
      # existan antes de mirar nada (P1012).
      - name: Generar el cliente de Prisma
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      - run: pnpm ${{ matrix.tarea }}
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viajapro
          POSTGRES_PASSWORD: viajapro
          POSTGRES_DB: neondb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      # Secretos de prueba: aleatorios y efimeros, nacen y mueren con el job. Nada en GitHub.
      - name: Secretos efimeros de prueba
        run: |
          {
            echo "WHATSAPP_DIRECTORY_PEPPER=$(openssl rand -hex 32)"
            echo "WEBHOOK_PAYLOAD_KEY=$(openssl rand -base64 32)"
            echo "WEBHOOK_PAYLOAD_KEY_VERSION=1"
            echo "META_APP_SECRET=$(openssl rand -hex 16)"
            echo "WHATSAPP_WEBHOOK_VERIFY_TOKEN=$(openssl rand -hex 16)"
            # ADR-0011: firma las cookies de sesion de las pruebas. Nace y muere con el job.
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)"
            echo "CORREO_PAYLOAD_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - name: Migraciones
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      # Las pruebas e2e de la API buscan la agencia demo y el catalogo real: la semilla.
      - name: Semilla
        run: pnpm --filter @viajapro/domain build && pnpm db:seed
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      # `pnpm test` incluye la prueba de aislamiento, que ya NO acepta caer al rol
      # propietario: sin este paso no habría DATABASE_APP_URL y abortaría, que es
      # exactamente lo que debe hacer.
      - name: Contraseñas de desarrollo para los roles de login
        run: node packages/database/scripts/roles-de-desarrollo.mjs
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DB_DEV_PASSWORD: clave-de-integracion-continua

      - name: Pruebas
        run: pnpm test
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          REDIS_URL: redis://localhost:6379
          APP_ENV: local

      # AUD-013. Esta prueba MUTA los roles del clúster (ALTER ROLE viajapro_app SUPERUSER unos
      # milisegundos) para demostrar que cada proceso aborta; corre SOLA, después de pnpm test,
      # para que ninguna otra prueba corra como ese rol mientras tanto. Con EXIGIR=1 no puede
      # pasar omitida: si la base no es desechable, falla.
      - name: Arranque seguro, los tres servicios abortan con un rol que salta RLS
        run: pnpm --filter @viajapro/api exec vitest run src/shared/prisma/arranque-seguro.e2e-spec.ts
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          REDIS_URL: redis://localhost:6379
          APP_ENV: local
          VIAJAPRO_BASE_DESECHABLE: '1'
          VIAJAPRO_EXIGIR_ARRANQUE_SEGURO: '1'

  # ---------------------------------------------------------------------------
  # La compuerta propia de este producto. Si falla, da igual lo demás:
  # una fuga entre agencias es el fallo que mata el negocio.
  aislamiento-tenants:
    name: aislamiento-tenants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viajapro
          POSTGRES_PASSWORD: viajapro
          POSTGRES_DB: neondb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      # La cadena del contenedor se compone con `format` y no se escribe entera: el
      # guardián de secretos del repositorio bloquea cualquier URL de base de datos con
      # contraseña, y tiene razón aunque esta sea la de un servicio efímero de CI.
      - name: Migraciones y políticas RLS
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

      # Sin este paso la compuerta NO SE PUEDE PONER EN VERDE, y eso fue un hallazgo
      # crítico: las migraciones crean los tres roles de login SIN contraseña —un LOGIN sin
      # contraseña no se conecta, que es el estado seguro por defecto— y la prueba ya no
      # acepta caer al rol propietario. Este paso las fija y exporta las tres cadenas por
      # GITHUB_ENV para el paso siguiente.
      - name: Contraseñas de desarrollo para los roles de login
        run: node packages/database/scripts/roles-de-desarrollo.mjs
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DB_DEV_PASSWORD: clave-de-integracion-continua

      # Corre con `viajapro_app`, que NO puede saltarse RLS. Antes caía al rol del
      # contenedor, que es SUPERUSUARIO: las aserciones pasaban sin probar nada, porque lo
      # único que lo vigilaba miraba `rolbypassrls` —falso en un superusuario— en vez de
      # preguntar qué rol se había conectado. DATABASE_APP_URL llega del paso anterior.
      - name: Un tenant no puede leer ni escribir datos de otro
        run: pnpm --filter @viajapro/database test:aislamiento
        env:
          DATABASE_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}
          DIRECT_URL: ${{ format('postgres{0}://{1}:{2}@localhost:5432/{3}', 'ql', 'viajapro', 'viajapro', 'neondb') }}

  # ---------------------------------------------------------------------------
  # ADR-0013: las imagenes que Render va a ejecutar tienen que construirse y arrancar el codigo
  # correcto ANTES de que exista una cuenta. No se publican en ningun registro.
  imagenes:
    name: imagenes-de-despliegue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construir la imagen de la API y el trabajador
        run: docker build -f apps/api/Dockerfile -t viajapro-api .

      - name: Comprobar la imagen de la API
        run: |
          # No root, con el cliente de Prisma generado y con los dos puntos de entrada.
          test "$(docker run --rm --entrypoint id viajapro-api -u)" != "0"
          docker run --rm --entrypoint test viajapro-api -f dist/main.js
          docker run --rm --entrypoint test viajapro-api -f dist/worker.js
          docker run --rm --entrypoint node viajapro-api -e "
            Promise.all([import('@viajapro/domain'), import('@viajapro/contracts'), import('@prisma/client')])
              .then(([, , p]) => { new p.PrismaClient(); console.log('imagen de la API: ok'); })"

      - name: Construir la imagen de la web
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://api.ejemplo.invalid
          -t viajapro-web .

      - name: Comprobar la imagen de la web
        run: |
          test "$(docker run --rm --entrypoint id viajapro-web -u)" != "0"
          docker run --rm --entrypoint test viajapro-web -f apps/web/server.js
          docker images --format '{{.Repository}} {{.Size}}' | grep '^viajapro-'

  # ---------------------------------------------------------------------------
  # Regla R4: los módulos no se importan entre sí. Es lo que permite extraer
  # servicios después, y lo primero que se erosiona.
  fronteras:
    name: fronteras-entre-modulos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Buscar importaciones directas entre módulos
        run: |
          set -o pipefail
          if [ ! -d apps/api/src/modules ]; then
            echo "Todavía no hay módulos. Nada que verificar."
            exit 0
          fi
          fallos=0
          for dir in apps/api/src/modules/*/; do
            modulo=$(basename "$dir")
            cruzadas=$(grep -rnE "from ['\"].*modules/" "$dir" \
              | grep -vE "modules/${modulo}/" || true)
            if [ -n "$cruzadas" ]; then
              echo "::error::El módulo '${modulo}' importa directamente de otro módulo:"
              echo "$cruzadas"
              fallos=1
            fi
          done
          if [ "$fallos" -ne 0 ]; then
            echo ""
            echo "Regla R4 de CLAUDE.md: los módulos se comunican por eventos de dominio o por"
            echo "puertos explícitos, nunca por importación directa."
            exit 1
          fi
          echo "Sin importaciones cruzadas entre módulos."

      # El grep de arriba solo ve rutas con `modules/` y ninguna lectura de datos. Este recorre las
      # importaciones relativas y busca modelos de Prisma y tablas de otro módulo: el caso de inbox
      # escribiendo en contactos y de quoting leyendo oportunidades, que el grep dejaba pasar.
      - name: Buscar accesos cruzados a datos y rutas relativas entre módulos
        run: node scripts/verificar-fronteras.mjs

  # ---------------------------------------------------------------------------
  # Los hooks de gobierno son código, y código sin pruebas se rompe en silencio.
  # Esta suite existe porque el guardián de rama tuvo un falso positivo en producción.
  hooks:
    name: politica-de-rama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Salía con 127 —orden no encontrada— porque este job nunca instaló pnpm.
      # Las pruebas de los hooks son Node puro y no necesitan dependencias, así que
      # basta con que exista el gestor para resolver el script.
      - name: Política de protección de rama
        run: pnpm test:hooks

  # ---------------------------------------------------------------------------
  commits:
    name: convencion-de-commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verificar Conventional Commits del PR
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
