# Siembra la agencia DEMO de staging (T-646). SOLO MANUAL. No pide ni toca ninguna credencial.
#
# Antes (T-600) un solo workflow sembraba Y ponia la contrasena del usuario de la demo: no se podia
# sembrar sin pasar una contrasena, y relanzarlo para refrescar datos le cambiaba la clave al cliente
# que ya habia conseguido entrar. Ahora son dos: este solo siembra; `rotar-credencial-demo-staging.yml`
# es el unico que toca una contrasena.
#
# Es seguro lanzarlo tantas veces como haga falta: la semilla es idempotente (upserts) y aqui no hay
# `inputs`, asi que no hay nada que escribir ni que filtrar. Corre el diagnostico (que se niega si
# hay agencias ajenas a la demo) y despues la semilla. No crea usuarios ni credenciales.
#
# No corre en push ni dentro de `deploy-staging.yml`. Usa el Environment `staging` (limitado a `main`)
# y su secreto DIRECT_URL, como `deploy-staging.yml`.

name: Sembrar demo de staging

on:
  workflow_dispatch:

concurrency:
  group: preparar-demo-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22.20.0'
  PNPM_VERSION: '9.12.0'

jobs:
  sembrar:
    name: sembrar
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Lo fija el workflow, no quien lo lanza. El script se niega si no vale `staging`.
      PREPARAR_DEMO_ENTORNO: staging
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      # Guardia explicita: solo staging, solo desde main, y con la conexion presente.
      - name: Negarse si no es staging
        run: |
          if [ "$PREPARAR_DEMO_ENTORNO" != "staging" ]; then
            echo "::error::Este workflow solo prepara staging."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Solo se lanza sobre main (es lo que el Environment staging permite): $GITHUB_REF."
            echo "## Demo de staging: NO se hizo nada (rama $GITHUB_REF, debe ser main)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Faltan los secretos del Environment 'staging' (DIRECT_URL). No se hizo nada."
            echo "## Demo de staging: NO se hizo nada (falta el secreto DIRECT_URL del Environment staging)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generar el cliente y compilar el dominio
        run: pnpm --filter @viajapro/database run generate && pnpm --filter @viajapro/domain build

      # Cuenta lo que hay ANTES de tocar nada y aplica las guardias. Si se niega, no se siembra.
      # No lee credenciales.
      - name: Diagnosticar
        run: pnpm --filter @viajapro/api exec tsx src/modules/identity/scripts/preparar-demo-staging.ts diagnosticar

      # La semilla existente, idempotente. En staging no pone apodos (no es loopback).
      - name: Sembrar la agencia demo
        run: pnpm --filter @viajapro/database exec tsx prisma/seed.ts

      - name: Resumen
        run: |
          {
            echo "## Demo de staging sembrada"
            echo
            echo "Datos de demostracion al dia. No se creo ni se toco ninguna credencial."
          } >> "$GITHUB_STEP_SUMMARY"
