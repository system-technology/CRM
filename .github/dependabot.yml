# Mantiene al dia los SHA de las acciones de GitHub (M1.5). Cada actualizacion llega como PR
# semanal y se revisa; los SHA no se tocan a mano.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # T-207: dependencias npm. Un solo PR semanal agrupado por tipo de actualizacion, para que el
  # propietario revise uno y no veinte. Las mayores van aparte: rompen cosas y se miran solas.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
